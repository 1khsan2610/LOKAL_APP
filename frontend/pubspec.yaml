name: ekonomi_lokal
description: EkonomiLokal - Platform Belanja UMKM Lokal Indonesia
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^3.3.2

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.3.1

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^8.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  badges: ^3.1.2
  lottie: ^3.0.0
  fl_chart: ^1.2.0
  smooth_page_indicator: ^2.0.1
  carousel_slider: ^5.0.0
  expandable: ^5.0.1

  # Maps & Location
  google_maps_flutter: ^2.6.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0

  # Image
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0

  # Notifications
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1

  # Payment (Midtrans)
  webview_flutter: ^4.7.0

  # Utils
  intl: ^0.20.3
  timeago: ^3.6.1
  url_launcher: ^6.3.2
  permission_handler: ^12.0.3
  connectivity_plus: ^7.2.0
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^5.1.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  go_router: ^17.3.0
  url_strategy: ^0.3.0
  file_picker: ^12.0.0-beta.7
  http: ^1.6.0
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  retrofit_generator: ^10.2.7
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
