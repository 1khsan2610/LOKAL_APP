version: '3.8'

services:
  # ============ BACKEND ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.flask
    container_name: lokal_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      FLASK_ENV: development
      FLASK_APP: app.py
    networks:
      - lokal_network
    restart: unless-stopped
    command: python app.py

  # ============ FRONTEND ============
  # Uncomment to run Flutter web in Docker
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile.flutter
  #   container_name: lokal_frontend
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - lokal_network
  #   restart: unless-stopped

  # ============ DATABASE (Optional) ============
  # Uncomment to use MySQL database
  # mysql:
  #   image: mysql:8.0
  #   container_name: lokal_mysql
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_DATABASE: lokal_app
  #     MYSQL_ROOT_PASSWORD: root
  #     MYSQL_USER: appuser
  #     MYSQL_PASSWORD: password
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - lokal_network
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     timeout: 20s
  #     retries: 10

  # ============ CACHE (Optional) ============
  # Uncomment to use Redis
  # redis:
  #   image: redis:7-alpine
  #   container_name: lokal_redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - lokal_network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     timeout: 3s
  #     retries: 5

networks:
  lokal_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
