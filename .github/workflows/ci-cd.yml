name: CI / CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-lint:
    name: Backend PHP Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.1'
          extensions: mbstring, bcmath, ctype, dom, fileinfo, pdo, pdo_mysql, xml, zip
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress --no-suggest --prefer-dist

      - name: Run Laravel Pint lint
        working-directory: backend
        run: |
          vendor/bin/pint -- --test

  backend-test:
    name: Backend PHP Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.1'
          extensions: mbstring, bcmath, ctype, dom, fileinfo, pdo, pdo_mysql, xml, zip
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress --no-suggest --prefer-dist

      - name: Create test environment file
        working-directory: backend
        run: |
          if [ -f .env.example ]; then cp .env.example .env; fi
          php artisan key:generate --force

      - name: Run PHPUnit tests
        working-directory: backend
        run: |
          php artisan test --no-tty

  flutter-analyze:
    name: Flutter Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosaka/setup-flutter@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        working-directory: frontend
        run: |
          flutter pub get

      - name: Run Flutter Analyze
        working-directory: frontend
        run: |
          flutter analyze

      - name: Run Flutter Tests
        working-directory: frontend
        run: |
          flutter test --no-pub

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - flutter-analyze
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: lokal_app_backend:ci

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: lokal_app_frontend:ci

      - name: Login to Docker registry
        if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}

      - name: Push backend image to registry
        if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD && secrets.DOCKER_REGISTRY && secrets.BACKEND_IMAGE_NAME }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ format('{0}/{1}:main', secrets.DOCKER_REGISTRY, secrets.BACKEND_IMAGE_NAME) }}

      - name: Push frontend image to registry
        if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD && secrets.DOCKER_REGISTRY && secrets.FRONTEND_IMAGE_NAME }}
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ format('{0}/{1}:main', secrets.DOCKER_REGISTRY, secrets.FRONTEND_IMAGE_NAME) }}

  deploy-production:
    name: Deploy to Production via SSH
    runs-on: ubuntu-latest
    needs: build-docker-image
    if: github.ref == 'refs/heads/main' && secrets.SSH_PRIVATE_KEY
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.5
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to remote server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            cd ${{ secrets.REMOTE_APP_PATH }}
            docker-compose pull
            docker-compose up -d --build
            docker system prune -af
