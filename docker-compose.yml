version: '3.8'

services:
  # ============ DATABASE & CACHE ============
  
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: lokal_app_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lokal_app}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-appuser}
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/migrations:/docker-entrypoint-initdb.d
    networks:
      - lokal_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: lokal_app_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - lokal_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  # ============ BACKEND SERVICES ============

  # Laravel Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PHP_VERSION: 8.1
    container_name: lokal_app_backend
    restart: unless-stopped
    working_dir: /app
    environment:
      # App Configuration
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-base64:xp4FLVmVJYLdgQ8OFcGDWq3Tnq4wvP5XQK4xR6JK2VQ=}
      APP_URL: ${APP_URL:-http://localhost:8000}

      # Database Configuration
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-lokal_app}
      DB_USERNAME: ${DB_USERNAME:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-password}

      # Cache & Session Configuration
      BROADCAST_DRIVER: ${BROADCAST_DRIVER:-log}
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-minio}

      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: 6379

      # JWT Authentication
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-this-in-production}
      JWT_TTL: ${JWT_TTL:-60}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-20160}

      # External Services
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-your_midtrans_server_key}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-your_midtrans_client_key}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}

      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-your_twilio_account_sid}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-your_twilio_auth_token}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-+1234567890}

      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-your_google_maps_api_key}

      # MinIO Object Storage (S3-Compatible)
      AWS_ACCESS_KEY_ID: ${MINIO_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET:-minioadmin}
      AWS_DEFAULT_REGION: ${MINIO_REGION:-us-east-1}
      AWS_BUCKET: ${MINIO_BUCKET:-lokal}
      AWS_URL: ${MINIO_URL:-http://localhost:9000}
      AWS_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"

      # Mail Configuration
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-LOKAL}

      # n8n Workflow Automation
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook}
      N8N_API_KEY: ${N8N_API_KEY:-your_n8n_api_key}

    ports:
      - "${BACKEND_PORT:-8000}:80"
      - "9000:9000"
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
      - ./backend/bootstrap/cache:/app/bootstrap/cache
      - backend_vendor:/app/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lokal_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: |
      sh -c "composer install --no-dev --no-interaction --optimize-autoloader &&
             php artisan config:cache &&
             php artisan route:cache &&
             php artisan view:cache &&
             php artisan migrate --force &&
             /usr/bin/supervisord -c /etc/supervisord.conf"

  # ============ STORAGE & AUTOMATION ============

  # MinIO Object Storage (S3-Compatible)
  minio:
    image: minio/minio:latest
    container_name: lokal_app_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - lokal_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    command: minio server /data --console-address ":9001"

  # n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: lokal_app_n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-admin}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_TUNNEL_URL: ${WEBHOOK_TUNNEL_URL:-http://n8n:5678/}
      DB_TYPE: postgre
      DB_POSTGRE_HOST: n8n_postgres
      DB_POSTGRE_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRE_PASSWORD: ${N8N_DB_PASSWORD:-n8n_password}
      DB_POSTGRE_DATABASE: ${N8N_DB_NAME:-n8n}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - n8n_postgres
    networks:
      - lokal_network

  # PostgreSQL for n8n
  n8n_postgres:
    image: postgres:15-alpine
    container_name: lokal_app_n8n_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-n8n_password}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    networks:
      - lokal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailPit Email Testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: lokal_app_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - lokal_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ FRONTEND ============

  # React Frontend (welcome-to-docker)
  frontend_web:
    build:
      context: ./welcome-to-docker
      dockerfile: Dockerfile
    container_name: lokal_app_web
    restart: unless-stopped
    ports:
      - "${FRONTEND_WEB_PORT:-3000}:3000"
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000/api}
    volumes:
      - ./welcome-to-docker:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - lokal_network

networks:
  lokal_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  n8n_data:
    driver: local
  n8n_postgres_data:
    driver: local
  backend_vendor:
    driver: local
