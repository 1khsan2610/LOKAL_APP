<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOKAL API Test Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            background: #4caf50;
            color: white;
            font-weight: bold;
            margin-top: 10px;
            animation: pulse 2s infinite;
        }

        .status-badge.offline {
            background: #f44336;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .endpoint {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            word-break: break-all;
            color: #333;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
            min-width: 100px;
        }

        button:hover {
            background: #764ba2;
        }

        button:active {
            transform: scale(0.98);
        }

        .response {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .response.error {
            border-left-color: #f44336;
            background: #ffebee;
        }

        .response.success {
            border-left-color: #4caf50;
            background: #f1f8e9;
        }

        .loading {
            display: inline-block;
            animation: spinner 1s linear infinite;
        }

        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .info-box h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .info-box p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .code {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏪 LOKAL Platform</h1>
            <p>Backend API Test Dashboard</p>
            <div id="statusBadge" class="status-badge">Checking...</div>
        </div>

        <div class="info-box">
            <h2>ℹ️ Informasi</h2>
            <p><strong>Backend URL:</strong> <span class="code">http://localhost:8000/api/v1</span></p>
            <p><strong>Status:</strong> Semua API endpoints dapat ditest melalui dashboard ini</p>
            <p><strong>Developer Mode:</strong> Gunakan Chrome/Firefox Developer Tools (F12) untuk melihat Network requests</p>
        </div>

        <div class="grid" id="grid"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        
        const endpoints = [
            {
                title: 'Authentication',
                endpoints: [
                    { name: 'Login/Register', method: 'POST', url: '/auth/login', data: { phone: '08123456789', role: 'consumer' } },
                    { name: 'Verify OTP', method: 'POST', url: '/auth/verify-otp', data: { phone: '08123456789', otp: '123456' } }
                ]
            },
            {
                title: 'Users',
                endpoints: [
                    { name: 'Get Profile', method: 'GET', url: '/users/profile' },
                    { name: 'Update Profile', method: 'PUT', url: '/users/profile', data: { name: 'John Doe', email: 'john@example.com' } }
                ]
            },
            {
                title: 'Products',
                endpoints: [
                    { name: 'Get All Products', method: 'GET', url: '/products?page=1&per_page=10' },
                    { name: 'Get Categories', method: 'GET', url: '/products/categories' },
                    { name: 'Get Product Detail', method: 'GET', url: '/products/prod_1' }
                ]
            },
            {
                title: 'UMKMs',
                endpoints: [
                    { name: 'Get All UMKMs', method: 'GET', url: '/umkms' },
                    { name: 'Get UMKM Detail', method: 'GET', url: '/umkms/umkm_1' }
                ]
            },
            {
                title: 'Orders',
                endpoints: [
                    { name: 'Get All Orders', method: 'GET', url: '/orders' },
                    { name: 'Create Order', method: 'POST', url: '/orders', data: { items: [], shippingAddress: 'Jl. Test', totalPrice: 100000 } },
                    { name: 'Get Order Detail', method: 'GET', url: '/orders/order_1' }
                ]
            },
            {
                title: 'Notifications',
                endpoints: [
                    { name: 'Get All Notifications', method: 'GET', url: '/notifications' },
                    { name: 'Mark as Read', method: 'PUT', url: '/notifications/notif_1/read' }
                ]
            },
            {
                title: 'Wallet',
                endpoints: [
                    { name: 'Get Wallet Balance', method: 'GET', url: '/wallet' },
                    { name: 'Get Transactions', method: 'GET', url: '/wallet/transactions' }
                ]
            },
            {
                title: 'Health',
                endpoints: [
                    { name: 'Health Check', method: 'GET', url: '/health' }
                ]
            }
        ];

        // Check API status
        async function checkStatus() {
            try {
                const response = await fetch(API_BASE + '/health');
                const badge = document.getElementById('statusBadge');
                if (response.ok) {
                    badge.textContent = '🟢 ONLINE';
                    badge.classList.remove('offline');
                } else {
                    badge.textContent = '🔴 OFFLINE';
                    badge.classList.add('offline');
                }
            } catch (e) {
                const badge = document.getElementById('statusBadge');
                badge.textContent = '🔴 OFFLINE';
                badge.classList.add('offline');
            }
        }

        // Call API
        async function callAPI(url, method, data) {
            try {
                const options = {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    }
                };

                if (data && method !== 'GET') {
                    options.body = JSON.stringify(data);
                }

                const response = await fetch(API_BASE + url, options);
                const responseData = await response.json();
                
                return {
                    status: response.status,
                    data: responseData,
                    success: response.ok
                };
            } catch (error) {
                return {
                    status: 0,
                    data: { error: error.message },
                    success: false
                };
            }
        }

        // Render UI
        function renderUI() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            endpoints.forEach(group => {
                const card = document.createElement('div');
                card.className = 'card';

                let content = `<h3>${group.title}</h3>`;

                group.endpoints.forEach((endpoint, idx) => {
                    content += `<div class="endpoint">${endpoint.method} ${endpoint.url}</div>`;
                    content += `<button onclick="testEndpoint('${endpoint.url}', '${endpoint.method}', ${idx}, '${group.title}')">
                        📤 Test
                    </button>`;
                });

                const responseDiv = document.createElement('div');
                responseDiv.id = `response-${group.title}`;
                responseDiv.className = 'response';
                responseDiv.style.display = 'none';

                card.innerHTML = content;
                card.appendChild(responseDiv);
                grid.appendChild(card);
            });
        }

        // Test endpoint
        async function testEndpoint(url, method, idx, group) {
            const responseDiv = document.getElementById(`response-${group}`);
            responseDiv.style.display = 'block';
            responseDiv.innerHTML = '<div class="loading">⏳ Loading...</div>';

            const endpoint = endpoints.find(e => e.title === group).endpoints[idx];
            const result = await callAPI(url, method, endpoint.data);

            const statusText = result.success ? '✅ Success' : '❌ Error';
            const responseClass = result.success ? 'success' : 'error';

            responseDiv.className = `response ${responseClass}`;
            responseDiv.innerHTML = `${statusText} (${result.status})\n\n${JSON.stringify(result.data, null, 2)}`;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkStatus();
            setInterval(checkStatus, 5000);
            renderUI();
        });
    </script>
</body>
</html>
