# LOKAL Platform - Docker Compose v1.5.0
# Mencakup: App (Laravel), DB (MySQL 8.0), Redis 7.2, n8n, ML Service (FastAPI)
# Letak: backend/docker-compose.yml

version: '3.8'

services:
  # ─── Laravel App ─────────────────────────────────────────────────
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: lokal_app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ekonomi_lokal
      DB_USERNAME: lokal_user
      DB_PASSWORD: ${DB_PASSWORD:-lokal_pass}
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
      MIDTRANS_IS_PRODUCTION: false
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/lokal-events
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: 60
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lokal_network

  # ─── MySQL 8.0 with SPATIAL support ──────────────────────────────
  db:
    image: mysql:8.0
    container_name: lokal_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ekonomi_lokal
      MYSQL_USER: lokal_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-lokal_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lokal_network

  # ─── Redis 7.2 ───────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: lokal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lokal_network

  # ─── n8n Workflow Engine ─────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: lokal_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_HOST: localhost
      N8N_SECURE_COOKIE: false
      WEBHOOK_URL: http://localhost:5678/
      DB_TYPE: sqlite
      DB_SQLITE_DATABASE: /home/node/.n8n/database.sqlite
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - lokal_network

  # ─── ML Service (FastAPI) ────────────────────────────────────────
  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    container_name: lokal_ml_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    networks:
      - lokal_network

networks:
  lokal_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
  n8n_data: