[supervisord]
nodaemon=true
user=root
logfile=/app/storage/logs/supervisord.log

[program:php-fpm]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/app/storage/logs/php-fpm.log

[program:nginx]
process_name=%(program_name)s_%(process_num)02d
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/app/storage/logs/nginx.log

[program:backup-scheduler]
process_name=%(program_name)s
command=sh -c "while true; do if [ $(date +%%H:%%M) = '02:00' ]; then sh /app/scripts/mysql-backup.sh; fi; sleep 60; done"
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/app/storage/logs/backup-scheduler.log
environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
