user appuser;
worker_processes auto;
error_log /app/storage/logs/nginx-error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Enhanced logging format with more details for security audit
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /app/storage/logs/nginx-access.log main;

    # Rate limiting zones
    # Zone for general API endpoints (100 req/min per token)
    limit_req_zone $http_x_api_token zone=api_limit:10m rate=100r/m;
    # Zone for authentication endpoints (10 req/min per IP)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Security: Hide nginx version
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss;

    server {
        listen 80;
        server_name _;
        root /app/public;
        index index.php index.html;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        # Rate limiting for API endpoints
        location ~ ^/api/v[0-9]/ {
            limit_req zone=api_limit burst=20 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Rate limiting for auth endpoints (stricter)
        location ~ ^/api/v[0-9]/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param X_API_TOKEN $http_x_api_token;
            include fastcgi_params;
        }

        # Disable access to hidden files
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
